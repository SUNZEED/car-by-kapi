<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Garage - ระบบเช่ารถ</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
        }
        h1 { color: #00d2ff; }
        .container { max-width: 900px; margin: 0 auto; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background-color: #1e1e1e;
        }
        th, td { 
            border: 1px solid #333; 
            padding: 12px; 
            text-align: center; 
        }
        th { background-color: #2b2b2b; color: #00d2ff; }
        tr:nth-child(even) { background-color: #181818; }
        
        .loading { text-align: center; color: #ffaa00; padding: 20px; }
        .status-free { color: #00ff00; font-weight: bold; }
        .status-rented { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌴 SUMMER GARAGE | ปล่อยเช่ารถ</h1>
    <p>ตารางรถซิงค์กับฐานข้อมูลออนไลน์ ทุกคนเห็นข้อมูลตรงกัน</p>

    <table>
        <thead>
            <tr>
                <th>ทะเบียน</th>
                <th>รุ่นรถ</th>
                <th>หมวดหมู่ / เจ้าของ</th>
                <th>สถานะตอนนี้</th>
            </tr>
        </thead>
        <tbody id="car-table-body">
            <!-- ข้อมูลจาก Sheet จะมาโชว์ตรงนี้ -->
            <tr><td colspan="4" class="loading">⏳ กำลังโหลดข้อมูลรถ...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // ⚠️ นำ URL จาก Google Apps Script (Web App) มาใส่ในเครื่องหมายคำพูดด้านล่าง
    const scriptURL = 'ใส่_URL_เว็บแอปของคุณที่นี่';

    async function loadCarsFromSheet() {
        try {
            const response = await fetch(scriptURL);
            const data = await response.json();
            
            const tbody = document.getElementById('car-table-body');
            tbody.innerHTML = ''; // ล้างข้อความโหลด

            // ตรวจสอบว่ามีข้อมูลส่งมาไหม (ความยาวมากกว่า 1 คือมีข้อมูลที่ไม่ใช่แค่หัวตาราง)
            if (data.length <= 1) {
                tbody.innerHTML = '<tr><td colspan="4">ยังไม่มีรถในระบบ</td></tr>';
                return;
            }

            // วนลูปข้อมูล เริ่มที่ i=1 เพื่อข้ามหัวตาราง (แถวแรกใน Sheet)
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                const plate = row[0] || '-';
                const model = row[1] || '-';
                const owner = row[2] || '-';
                const status = row[3] || '-';

                // เปลี่ยนสีข้อความสถานะ (ถ้าต้องการ)
                let statusClass = '';
                if(status === 'ว่าง') statusClass = 'status-free';
                if(status === 'เช่าอยู่') statusClass = 'status-rented';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${plate}</td>
                    <td>${model}</td>
                    <td>${owner}</td>
                    <td class="${statusClass}">${status}</td>
                `;
                tbody.appendChild(tr);
            }
        } catch (error) {
            console.error('Error loading data:', error);
            document.getElementById('car-table-body').innerHTML = '<tr><td colspan="4" style="color:red;">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล (เช็ค URL ในโค้ดอีกครั้ง)</td></tr>';
        }
    }

    // สั่งให้โหลดข้อมูลทันทีที่เปิดเว็บ
    window.onload = loadCarsFromSheet;
</script>

</body>
</html>
